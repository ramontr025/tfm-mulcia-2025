version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.6
    container_name: snowstorm-es
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?local=true || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - snowstorm-net

  snowstorm:
    image: snomedinternational/snowstorm:latest
    container_name: snowstorm-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_URLS=http://snowstorm-es:9200
      - JDK_JAVA_OPTIONS=--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.desktop/java.awt.font=ALL-UNNAMED
      - JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "8080:8080"
    networks:
      - snowstorm-net

networks:
  snowstorm-net:
    driver: bridge
